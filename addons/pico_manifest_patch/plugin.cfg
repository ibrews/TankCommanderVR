[plugin]

name="PICO Manifest Patch"
description="Adds the pvr.app.type=vr meta-data tag to the Android export manifest so PICO's OS (and PICO's emulator) recognizes this as a full immersive VR app, not just an OpenXR app with no vendor declaration. Required for the app to be granted full 3D/compositor resume on PICO devices/the PICO Emulator -- without it, PICO OS reports 'No 3D activity resumed' and the app renders nothing visible even though it's running. Godot's own build template regenerates android/build/ from scratch (it's gitignored), so this has to be injected via the EditorExportPlugin manifest-customization API rather than hand-edited -- see intelligence/techniques/pico-xr-emulator-vs-cloudxr-simulation.md in the Agile Lens KB for the full investigation this came out of."
author="Agile Lens"
version="1.0"
script="plugin.gd"
